name: Build Windows 7 EXE (32-bit & 64-bit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Gradle compilation (targets JVM 1.8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Test and Build Windows Fat JAR (JVM 1.8)
        run: gradle -p windows test fatJar --no-daemon

      - name: Set up MinGW 32-bit compiler (Windows 7 compatible PE32)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc

      - name: Prepare package directory and copy Desktop JAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows/build/package/app | Out-Null
          New-Item -ItemType Directory -Force -Path windows/build/tools | Out-Null
          Copy-Item -Path "windows/build/libs/Meteotablo-desktop.jar" -Destination "windows/build/package/app/Meteotablo-desktop.jar" -Force
          if (-not (Test-Path "windows/assets/meteotablo.ico")) {
            throw "windows/assets/meteotablo.ico not found"
          }

      - name: Download 32-bit JRE 8 (Windows 7 32-bit & 64-bit compatible)
        shell: pwsh
        run: |
          # 32-bit OpenJDK 8 JRE from Adoptium (runs on both x86 and x64 Windows 7)
          $jreUrl = "https://api.adoptium.net/v3/binary/latest/8/ga/windows/x86/jre/hotspot/normal/eclipse?project=jdk"
          Invoke-WebRequest -Uri $jreUrl -OutFile "windows/build/tools/jre8-x86.zip"
          Expand-Archive -Path "windows/build/tools/jre8-x86.zip" -DestinationPath "windows/build/tools/jre-extract" -Force
          $jreDir = Get-ChildItem -Path "windows/build/tools/jre-extract" -Directory | Select-Object -First 1
          if (Test-Path "windows/build/package/jre") {
            Remove-Item -Path "windows/build/package/jre" -Recurse -Force
          }
          Move-Item -Path $jreDir.FullName -Destination "windows/build/package/jre" -Force
          & "windows/build/package/jre/bin/java.exe" -version

      - name: Build Meteotablo.exe (32-bit Windows PE)
        shell: msys2 {0}
        working-directory: windows/launcher
        run: |
          set -euo pipefail
          windres --version
          gcc --version
          windres launcher.rc -O coff -o ../build/launcher.res
          gcc -mwindows -municode -O2 -s -Wall -Wextra -Werror launcher.c ../build/launcher.res -o ../build/package/Meteotablo.exe
          if command -v file >/dev/null 2>&1; then file ../build/package/Meteotablo.exe; fi

      - name: Verify 32-bit PE header and package contents
        shell: pwsh
        run: |
          $exe = "windows/build/package/Meteotablo.exe"
          $jar = "windows/build/package/app/Meteotablo-desktop.jar"
          $javaw = "windows/build/package/jre/bin/javaw.exe"
          foreach ($p in @($exe, $jar, $javaw)) {
            if (-not (Test-Path $p)) { throw "Missing package file: $p" }
          }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014C) {
            throw ("Expected 32-bit x86 PE (0x014C), got 0x{0:X4}" -f $machine)
          }
          Write-Host "Verified 32-bit x86 Windows GUI executable: $exe"

      - name: Create Portable ZIP (Meteotablo.exe + 32-bit JRE 8)
        shell: pwsh
        run: |
          Compress-Archive -Path "windows/build/package/*" -DestinationPath "windows/build/Meteotablo-Win7-Portable-x86-x64.zip" -Force

      - name: Build Single-File Installer EXE with Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows/build/installer | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "windows/installer.iss"
          } else {
            choco install innosetup -y
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows/installer.iss"
          }

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Meteotablo-Win7-Portable-x86-x64
          path: windows/build/Meteotablo-Win7-Portable-x86-x64.zip
          if-no-files-found: error

      - name: Upload Windows Setup Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: Meteotablo-Win7-Setup-EXE
          path: windows/build/installer/Meteotablo-Setup-Win7-x86-x64.exe
          if-no-files-found: error
