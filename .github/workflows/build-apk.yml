name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (API 36.1 & Build Tools 36.0.0)
        shell: bash
        run: |
          set -euo pipefail
          SYS_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ -d "$SYS_SDK/platforms/android-36.1" ] && [ -d "$SYS_SDK/build-tools/36.0.0" ] && [ -d "$SYS_SDK/licenses" ]; then
            echo "Using pre-installed Android SDK at $SYS_SDK"
            echo "ANDROID_HOME=$SYS_SDK" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SYS_SDK" >> "$GITHUB_ENV"
            exit 0
          fi

          USER_SDK="$HOME/android-sdk"
          mkdir -p "$USER_SDK"

          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$SYS_SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SYS_SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SYS_SDK" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Downloading Android command-line tools into $USER_SDK..."
            mkdir -p "$USER_SDK/cmdline-tools"
            rm -rf /tmp/cmdline-extract /tmp/cmdline-tools.zip
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            rm -rf "$USER_SDK/cmdline-tools/latest"
            if [ -d /tmp/cmdline-extract/cmdline-tools ]; then
              mv /tmp/cmdline-extract/cmdline-tools "$USER_SDK/cmdline-tools/latest"
            elif [ -d /tmp/cmdline-extract/tools ]; then
              mv /tmp/cmdline-extract/tools "$USER_SDK/cmdline-tools/latest"
            else
              echo "Unexpected cmdline-tools archive layout:"
              ls -la /tmp/cmdline-extract
              exit 1
            fi
            SDKMANAGER="$USER_SDK/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          echo "Using sdkmanager: $SDKMANAGER (installing into $USER_SDK)"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$USER_SDK" --licenses >/dev/null || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$USER_SDK" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

          echo "ANDROID_HOME=$USER_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$USER_SDK" >> "$GITHUB_ENV"
          echo "$USER_SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Prepare debug keystore and env file
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          mkdir -p "$RUNNER_TEMP/apk-out"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk-out/Meteotablo.apk"
          ls -lh "$RUNNER_TEMP/apk-out/Meteotablo.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meteotablo-Android-APK
          path: ${{ runner.temp }}/apk-out/Meteotablo.apk
          if-no-files-found: error
