name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0

      - name: Prepare debug keystore and env file
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon
          mkdir -p build/apk-out
          cp app/build/outputs/apk/debug/app-debug.apk build/apk-out/Meteotablo.apk
          ls -lh build/apk-out/Meteotablo.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meteotablo-Android-APK
          path: build/apk-out/Meteotablo.apk
          if-no-files-found: error
